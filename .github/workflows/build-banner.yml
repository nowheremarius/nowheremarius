name: Build monochrome banner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_banner.py
      - .github/workflows/build-banner.yml

permissions:
  contents: write

jobs:
  banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow requests
      - run: python scripts/build_banner.py
      - name: Publish generated asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/monolith-banner.jpg
          if ! git diff --cached --quiet; then
            git commit -m "assets: publish text-free monochrome hero"
            git push
          fi
