name: Build editorial software gallery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_software_gallery.py
      - .github/workflows/build-software-gallery.yml
      - assets/blender.svg
      - assets/audition.svg
      - assets/photoshop.svg
      - assets/vegas.svg

permissions:
  contents: write

jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow requests cairosvg
      - run: python scripts/build_software_gallery.py
      - name: Save optimized galleries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/software-row-1.png assets/software-row-2.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: publish borderless monochrome software gallery"
            git push
          fi
