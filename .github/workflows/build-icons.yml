name: Build software marks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_icons.py
      - .github/workflows/build-icons.yml

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow requests cairosvg
      - run: python scripts/build_icons.py
      - name: Commit monochrome marks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*-mark.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: add monochrome software marks"
            git push
          fi
